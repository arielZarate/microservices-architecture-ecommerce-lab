
server:
  port: 8080
  servlet:
    context-path: /api


spring:
  application:
    name: products-service

  #database
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    #database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

# documentation
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html


# Api key
external:
  api-key: ${EXTERNAL_API_KEY}
  device-id: ${EXTERNAL_DEVICE_ID}

# JWT 
jwt:
  secret: ${JWT_SECRET}


#Monitoring - metrics
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
