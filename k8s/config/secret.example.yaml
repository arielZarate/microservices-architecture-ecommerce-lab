apiVersion: v1
kind: Secret
metadata:
  name: lab-secrets
  namespace: lab
type: Opaque
stringData:
  # Plantilla: copiar a secret.yaml (gitignoreado) y reemplazar los CHANGE_ME
  #   cp k8s/config/secret.example.yaml k8s/config/secret.yaml
  # Los nombres de las claves NO se cambian: los Deployments las referencian por nombre.
  POSTGRES_USER: CHANGE_ME
  POSTGRES_PASSWORD: CHANGE_ME
  JWT_SECRET: CHANGE_ME_MINIMO_32_CARACTERES_PARA_HS256
  EXTERNAL_API_KEY: CHANGE_ME
  EXTERNAL_DEVICE_ID: CHANGE_ME
  DATABASE_URL_USERS: postgresql://CHANGE_ME:CHANGE_ME@postgres:5432/users_management
  DATABASE_URL_ORDERS: postgresql://CHANGE_ME:CHANGE_ME@postgres:5432/orders_management
