server:
  port: 8081
  servlet:
    context-path: /api


spring:
  application:
    name: shipment-service

  #database
  datasource:
    url: jdbc:postgresql://localhost:5432/shipment_management
    username: postgres
    password: 1111
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

# documentation
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html


# External clients
externals:
  user-client:
    host: http://localhost:4000
    path: /api/users
    timeout: 5000
  address-client:
    host: http://localhost:4000
    path: /api/address
    timeout: 5000

# Api key
external:
  api-key: a1b2c3d4-e5f6-7890-abcd-ef1234567890

#Monitoring - metrics
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
