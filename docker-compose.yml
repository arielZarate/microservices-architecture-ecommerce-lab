services:
  kafka:
    image: apache/kafka:4.3.0
    container_name: kafka-container
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-container:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

  kafka-init:
    image: apache/kafka:4.3.0
    container_name: kafka-init
    depends_on:
      - kafka
    entrypoint: ["/bin/sh", "-c"]
    command: |
      echo "Waiting for Kafka to be ready..."
      until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-container:9092 --list >/dev/null 2>&1; do
        sleep 2
      done
      echo "Creating topics order-shipped and order-delivered..."
      /opt/kafka/bin/kafka-topics.sh --create --topic order-shipped --bootstrap-server kafka-container:9092 --partitions 1 --replication-factor 1 --if-not-exists
      /opt/kafka/bin/kafka-topics.sh --create --topic order-delivered --bootstrap-server kafka-container:9092 --partitions 1 --replication-factor 1 --if-not-exists
      echo "Topics created successfully"
    restart: "no"
