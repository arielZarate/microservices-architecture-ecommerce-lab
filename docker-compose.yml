
services:

  # =======================DATABASES===================================

  postgres:
    image: postgres:17
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      # POSTGRES_DB se omite: las 4 bases se crean en docker/postgres/init/01-databases.sql
    ports:
      - "5432:5432"                # solo para dev; en prod se omite
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [ ecommerce ]

#=======================PRODUCTS SERVICE===============================

  products-service:
    container_name: products-service
    build: ./products-service
    depends_on:
      postgres:
        condition: service_healthy       # no arranca hasta que la DB esté lista
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/products_management
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-admin}
    ports: [ "8080:8080" ]
    networks: [ ecommerce ]

   
   #=====================USER SERVICE=========================

  user-service-migrate:
    container_name: user-service-migrate
    image: user-service:latest
    command: [ "npx", "prisma", "migrate", "deploy" ]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-admin}@postgres:5432/users_management
    networks: [ ecommerce ]
    restart: "no"

  user-service:
    container_name: user-service
    image: user-service:latest
    build: ./user-service
    depends_on:
      postgres:
        condition: service_healthy       # no arranca hasta que la DB esté lista
      user-service-migrate:
        condition: service_completed_successfully   # espera a que migre
    environment:
      PORT: 4000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      DB_NAME: users_management
      JWT_SECRET: ${JWT_SECRET:-sapee2026superSecretKeyForJwt256bits!!}
      API_KEY: ${API_KEY:-idApp1237897key}
      DEVICE_ID: ${DEVICE_ID:-idDevice321567Device}
    ports: [ "4000:4000" ]
    networks: [ ecommerce ]


#================ORDERS SERVICE===========================
  order-service-migrate:
    container_name: order-service-migrate
    image: order-service:latest
    command: [ "npx", "prisma", "migrate", "deploy" ]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-admin}@postgres:5432/orders_management
    networks: [ ecommerce ]
    restart: "no"

  order-service:
    container_name: order-service
    image: order-service:latest
    build: ./order-service
    depends_on:
      postgres:
        condition: service_healthy
      order-service-migrate:
        condition: service_completed_successfully
    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      DB_NAME: orders_management
      KAFKA_BROKER: kafka-container:29092
      PRODUCT_SERVICE_URL: http://products-service:8080/api
      JWT_SECRET: ${JWT_SECRET:-sapee2026superSecretKeyForJwt256bits!!}
      API_KEY: ${API_KEY:-idApp1237897key}
      DEVICE_ID: ${DEVICE_ID:-idDevice321567Device}
    ports: [ "3000:3000" ]
    networks: [ ecommerce ]








  ## ==================KAFKA=====================================

  kafka:
    image: apache/kafka:4.3.0
    container_name: kafka-container
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-container:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka-container:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    networks: [ ecommerce ]

  kafka-init:
    image: apache/kafka:4.3.0
    container_name: kafka-init
    depends_on:
      - kafka
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for Kafka to be ready..."
        until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-container:29092 --list >/dev/null 2>&1; do
          sleep 2
        done
        for topic in order-paid order-preparing order-shipped order-delivered; do
          echo "Creating topic $$topic..."
          /opt/kafka/bin/kafka-topics.sh --create --topic "$$topic" --bootstrap-server kafka-container:29092 --partitions 1 --replication-factor 1 --if-not-exists
        done
        echo "Topics created successfully"
    networks: [ ecommerce ]
    restart: "no"

volumes:
  postgres-data:

networks:
  ecommerce:
