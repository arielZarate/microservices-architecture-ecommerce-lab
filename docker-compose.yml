
services:

  # =======================DATABASES===================================

  postgres:
    image: postgres:17
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      # POSTGRES_DB se omite: las 4 bases se crean en docker/postgres/init/01-databases.sql
    ports:
      - "5432:5432"                # solo para dev; en prod se omite
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [ ecommerce ]

  products-service:
    container_name: products-service
    build: ./products-service
    depends_on:
      postgres:
        condition: service_healthy       # no arranca hasta que la DB esté lista
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/products_management
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-admin}
    ports: [ "8080:8080" ]
    networks: [ ecommerce ]








  ## ==================KAFKA=====================================

  kafka:
    image: apache/kafka:4.3.0
    container_name: kafka-container
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-container:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

  kafka-init:
    image: apache/kafka:4.3.0
    container_name: kafka-init
    depends_on:
      - kafka
    entrypoint: ["/bin/sh", "-c"]
    command: |
      echo "Waiting for Kafka to be ready..."
      until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-container:9092 --list >/dev/null 2>&1; do
        sleep 2
      done
      echo "Creating topics order-shipped and order-delivered..."
      /opt/kafka/bin/kafka-topics.sh --create --topic order-shipped --bootstrap-server kafka-container:9092 --partitions 1 --replication-factor 1 --if-not-exists
      /opt/kafka/bin/kafka-topics.sh --create --topic order-delivered --bootstrap-server kafka-container:9092 --partitions 1 --replication-factor 1 --if-not-exists
      echo "Topics created successfully"
    restart: "no"

volumes:
  postgres-data:

networks:
  ecommerce:
